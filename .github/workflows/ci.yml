name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff

      - name: Lint orchestrator
        run: ruff check services/orchestrator/ --select=E9,F63,F7,F82 --ignore=F401

      - name: Lint stt
        run: ruff check services/stt/ --select=E9,F63,F7,F82 --ignore=F401

      - name: Lint tts
        run: ruff check services/tts/ --select=E9,F63,F7,F82 --ignore=F401

  docker-build:
    name: Docker Compose Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate docker-compose
        run: docker compose config

      - name: Build orchestrator
        run: docker compose build orchestrator

      - name: Build stt
        run: docker compose build stt

      - name: Build tts
        run: docker compose build tts

      - name: Build visual-shell
        run: docker compose build visual-shell

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for secrets
        run: |
          # Fail if any obvious secrets are committed
          ! grep -rE "(api[_-]?key|secret|password|token)[[:space:]]*=[[:space:]]*['\"][a-zA-Z0-9]{20,}" \
            --include="*.py" --include="*.yml" --include="*.yaml" --include="*.json" \
            --exclude-dir=".git" --exclude-dir="node_modules" . || \
            (echo "Potential secrets detected" && exit 1)

      - name: Check for committed DB
        run: |
          if [ -f "config/samantha_memory.db" ]; then
            echo "ERROR: Personal memory database committed!"
            exit 1
          fi

      - name: Check for .env
        run: |
          if [ -f ".env" ]; then
            echo "ERROR: .env file committed!"
            exit 1
          fi
