name: Feature Request
description: Suggest an idea for Samantha
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like Samantha to be able to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why?
      description: What problem does this solve? What makes Samantha feel more alive?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Personality / tone
        - Voice / TTS
        - Memory / knowledge
        - Integrations (weather, news, etc.)
        - Visual shell / UI
        - Performance
        - Documentation
